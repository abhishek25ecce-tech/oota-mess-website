<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oota | Azim Premji University</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>

<h1>🍽 Oota</h1>

<p>Azim Premji University</p>

</header>

<nav>

<a href="index.html">Today's Menu</a>

<a href="weekly.html">Weekly Menu</a>

<a href="timings.html">Meal Timings</a>

</nav>

<section class="today">

<h2>Today's Menu</h2>

<div class="today-date" id="todayDate">
    Loading date...
</div>

<div class="home-status" id="homeStatus">
    Checking meal status...
</div>
<div class="food-vibe-box">

    <div class="vibe-heading">
        ✨ FOOD VIBE ✨
    </div>

    <div class="dominant-vibe-wrapper">
        <div class="dominant-vibe" id="dominantVibe">
            😋
        </div>
    </div>

    <div class="vibe-message" id="vibeMessage">
        Looking good!
    </div>

    <div class="vibe-emojis">
        <button data-vibe="😍" aria-label="Loved it">😍</button>
        <button data-vibe="😋" aria-label="Good">😋</button>
        <button data-vibe="🙂" aria-label="Okay">🙂</button>
        <button data-vibe="😐" aria-label="Mixed">😐</button>
        <button data-vibe="😕" aria-label="Could be better">😕</button>
    </div>

    <div class="vibe-hint" id="vibeHint">
        Tap an emoji to share your vibe
    </div>

</div>
<p id="menuMessage"></p>

<div class="card" id="breakfastCard">
<h3>🍳 Breakfast</h3>
<p id="breakfast">Loading...</p>
</div>

<div class="card" id="lunchCard">
<h3>🍛 Lunch</h3>
<p id="lunch">Loading...</p>
</div>

<div class="card" id="snacksCard">
<h3>☕ Snacks</h3>
<p id="snacks">Loading...</p>
</div>

<div class="card" id="dinnerCard">
<h3>🍽 Dinner</h3>
<p id="dinner">Loading...</p>
</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="app.js"></script>

</body>

</html>
